  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyB0qGG-uxM8pa8k1ryqYGaGF4EdtfyUakc"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "sg-antigravity.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "sg-antigravity"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "sg-antigravity.firebasestorage.app"
