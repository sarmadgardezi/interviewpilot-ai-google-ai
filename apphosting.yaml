# Settings for Cloud Run backend service
runConfig:
  minInstances: 0
  maxInstances: 5
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

# Environment variables and secrets (exact mirror of .env)
env:
  # Firebase Client Configuration (App Router Client & SSR)
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyB0qGG-uxM8pa8k1ryqYGaGF4EdtfyUakc"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "sg-antigravity.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "sg-antigravity"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "sg-antigravity.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "580909799171"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:580909799171:web:62078704215c1ad520bb36"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: ""
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_DATABASE_URL
    value: "https://sg-antigravity-default-rtdb.firebaseio.com"
    availability:
      - BUILD
      - RUNTIME

  # AI Provider Configuration
  - variable: AI_PROVIDER
    value: "openrouter"
    availability:
      - BUILD
      - RUNTIME

  # Google AI Studio Gemini API Keys
  - variable: GEMINI_API_KEY
    value: ""
    availability:
      - RUNTIME

  - variable: GOOGLE_API_KEY
    value: ""
    availability:
      - RUNTIME
