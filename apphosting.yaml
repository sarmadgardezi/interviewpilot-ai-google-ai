# Settings for Cloud Run backend service
runConfig:
  minInstances: 0
  maxInstances: 5
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

# Environment variables and secrets
# Replace placeholder values below with your credentials, or connect them via Cloud Secret Manager
env:
  # Firebase Client Configuration (App Router Client & SSR)
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "your_firebase_api_key_here"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "your_project_id.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "your_project_id"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "your_project_id.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "your_messaging_sender_id_here"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "your_firebase_app_id_here"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_DATABASE_URL
    value: "https://your_project_id-default-rtdb.firebaseio.com"
    availability:
      - BUILD
      - RUNTIME

  # AI Provider Configuration (Google AI Studio Gemini Priority 1)
  - variable: AI_PROVIDER
    value: "gemini"
    availability:
      - BUILD
      - RUNTIME

  # Google AI Studio Gemini API Key
  # You can specify direct value here or link to Secret Manager: secret: gemini-api-key
  - variable: GEMINI_API_KEY
    value: "your_google_ai_studio_gemini_key_here"
    availability:
      - RUNTIME

  # OpenRouter Provider Fallback (Priority 2)
  # You can specify direct value here or link to Secret Manager: secret: openrouter-api-key
  - variable: OPENROUTER_API_KEY
    value: "your_openrouter_api_key_here"
    availability:
      - RUNTIME

  - variable: OPENROUTER_MODEL
    value: "google/gemma-4-26b-a4b-it:free"
    availability:
      - RUNTIME
